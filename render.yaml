# Blueprint Render (paket gratis): https://render.com/docs/blueprint-spec
# Dua layanan terpisah:
#   silengkap-rheus : server RheusInterface (otak + API)
#   silengkap       : antarmuka web SiLengkap (situs statis)
services:
  - type: web
    name: silengkap-rheus
    runtime: docker
    rootDir: rheus
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: YT_PROXY_URL      # opsional, bila YouTube memblokir IP server
        sync: false

  - type: web
    name: silengkap
    runtime: static
    staticPublishPath: ./web
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
