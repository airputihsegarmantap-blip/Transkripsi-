name: Cek sumber data RheusInterface

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sources.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Cek setiap sumber
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          probe() {
            code=$(curl -s -A "$UA" -L -o /tmp/out -w '%{http_code}' --max-time 20 "$1")
            echo "=== $code $(wc -c </tmp/out)B $1"
            head -c ${2:-600} /tmp/out | tr '\n' ' '; echo
          }
          probe "https://news.google.com/rss/search?q=kripto+OR+bitcoin+when:1d&hl=id&gl=ID&ceid=ID:id" 1500
          probe "https://news.google.com/rss/headlines/section/topic/WORLD?hl=id&gl=ID&ceid=ID:id" 900
          probe "https://news.google.com/rss/search?q=viral+when:1d&hl=id&gl=ID&ceid=ID:id" 900
          probe "https://feeds.bbci.co.uk/indonesia/rss.xml" 500
          probe "https://www.cnbcindonesia.com/market/rss" 500
          probe "https://cointelegraph.com/rss" 300
          probe "https://www.coindesk.com/arc/outboundfeeds/rss/" 300
          probe "https://www.reddit.com/r/CryptoCurrency/hot.json?limit=5" 700
          probe "https://www.reddit.com/r/indonesia/hot.json?limit=5" 300
          probe "https://www.reddit.com/r/CryptoCurrency/hot/.rss?limit=5" 300
          probe "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,idr&include_24hr_change=true&include_24hr_vol=true&include_market_cap=true" 400
          probe "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=2" 300
          probe "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=200&interval=daily" 200
          probe "https://api.coingecko.com/api/v3/global" 400
          probe "https://api.alternative.me/fng/?limit=2" 400
          probe "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=3" 400
          probe "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT" 400
          probe "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP" 400
          probe "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1440" 300
          probe "https://api.blockchain.info/charts/market-price?timespan=1year&format=json" 200
