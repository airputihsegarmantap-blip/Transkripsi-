<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TranskripKu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="brand">
    <img src="logo.jpg" alt="Logo TranskripKu" class="logo">
    <div>
      <h1>TranskripKu</h1>
      <p>Transkripsi &amp; ringkasan video YouTube berbahasa Indonesia</p>
    </div>
  </header>

  <main>
    <form id="form" class="card">
      <label for="url">Link video YouTube</label>
      <div class="row">
        <input id="url" type="url" required placeholder="Tempel link YouTube…" autocomplete="off">
        <button id="go" type="submit">Proses</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </form>

    <section id="video" class="card hidden">
      <div class="thumb-wrap">
        <img id="thumb" alt="">
        <button id="openYt" type="button" class="play" aria-label="Buka di YouTube">▶</button>
      </div>
      <h2 id="title"></h2>
      <p id="meta" class="muted small"></p>
    </section>

    <section id="summaryCard" class="card hidden">
      <div class="card-head">
        <h2>Ringkasan</h2>
        <button class="ghost" id="copySummary">Salin</button>
      </div>
      <div id="summary" class="prose"></div>
    </section>

    <section id="transcriptCard" class="card hidden">
      <div class="card-head">
        <h2>Transkrip</h2>
        <div class="actions">
          <label class="toggle"><input id="showTime" type="checkbox" checked> Waktu</label>
          <button class="ghost" id="copyTranscript">Salin</button>
          <button class="ghost" id="shareAll">Bagikan</button>
        </div>
      </div>
      <div id="transcript" class="transcript"></div>
    </section>
  </main>

  <footer class="muted small">Ringkasan oleh TranscriptBot · berjalan langsung di HP, tanpa server</footer>

  <script src="../transcriptbot.js"></script>
  <script src="app.js"></script>
</body>
</html>
